<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Basic CV</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="basic-card">
    <header class="basic-header">
      <div class="avatar"><img data-field="photo" alt="photo" /></div>
      <div class="name">
        <div class="fullname"><span data-field="firstName"></span> <span data-field="lastName"></span></div>
        <div class="contact"><span data-field="email"></span> • <span data-field="phone"></span></div>
      </div>
    </header>

    <section class="personal">
      <h3>Personal</h3>
      <div data-field="address"></div>
    </section>

    <section class="summary">
      <h3>Profile / Summary</h3>
      <div data-field="summary"></div>
    </section>

    <section class="experience">
      <h3>Work Experience</h3>
      <div data-field="experiences"></div>
    </section>

    <section class="education">
      <h3>Education</h3>
      <div data-field="education"></div>
    </section>

    <section class="skills">
      <h3>Skills</h3>
      <div data-field="skills"></div>
    </section>
  </div>
</body>
</html>
