<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Professional CV</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="pro-card">
    <aside class="left">
      <div class="avatar"><img data-field="photo" alt="photo"></div>
      <h2 class="name"><span data-field="firstName"></span> <span data-field="lastName"></span></h2>

      <section class="personal">
        <h4>Personal</h4>
        <div data-field="address"></div>
        <div data-field="email"></div>
        <div data-field="phone"></div>
      </section>

      <div class="skills">
        <h4>Skills</h4>
        <div data-field="skills"></div>
      </div>
    </aside>

    <main class="right">
      <section class="summary">
        <h3>Profile / Summary</h3>
        <div data-field="summary"></div>
      </section>

      <section class="experience">
        <h3>Work Experience</h3>
        <div data-field="experiences"></div>
      </section>

      <section class="education">
        <h3>Education</h3>
        <div data-field="education"></div>
      </section>
    </main>
  </div>
</body>
</html>
