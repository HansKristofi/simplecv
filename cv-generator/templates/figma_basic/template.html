<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="template.css">
  <title>CV - Basic Template</title>
</head>
<body>
  <div class="cv-container">
    <h1>Personal</h1>
    <p id="cv-name"></p>
    <p id="cv-address"></p>
    <p id="cv-email"></p>
    <p id="cv-phone"></p>
    
    <h2>Work Experience</h2>
    <div id="cv-experience"></div>
    
    <h2>Education</h2>
    <div id="cv-education"></div>
    
    <h2>Skills</h2>
    <p id="cv-skills"></p>
    
    <h2>Profile / Summary</h2>
    <p id="cv-summary"></p>
  </div>
</body>
</html>
